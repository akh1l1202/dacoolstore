[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dacoolstore"
version = "1.0.0"
description = "A professional, modernized online store desktop application built with PySimpleGUI and MySQL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Akhil Tyagi", email = "tyagi.akhil1202@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "PySimpleGUI>=4.60.0,<5.0.0",
    "mysql-connector-python>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/akh1l1202/dacoolstore"
"Bug Tracker" = "https://github.com/akh1l1202/dacoolstore/issues"

[project.scripts]
dacoolstore = "dacoolstore.__main__:main"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "RUF"]
ignore = [
    "E501",  # Line too long (common for PySimpleGUI layouts)
]

[tool.ruff.lint.isort]
known-first-party = ["dacoolstore"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
